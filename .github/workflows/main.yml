name: ONYX Smart Accounting - Windows and Android builds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Clone source (repository name ends in a dot)
        shell: pwsh
        run: git clone --depth 1 "https://github.com/${{ github.repository }}.git" source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate source
        working-directory: source
        shell: pwsh
        run: |
          if (!(Test-Path "package.json")) { throw "package.json missing" }
          if (!(Test-Path "main.js")) { throw "main.js missing" }
          if (!(Test-Path "smart-accountant.html")) { throw "smart-accountant.html missing" }
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node --check main.js
          $html = Get-Content "smart-accountant.html" -Raw
          $match = [regex]::Match($html, '(?s)<script>(.*?)</script>')
          if (!$match.Success) { throw "Application script missing" }
          Set-Content -Path "app-check.js" -Value $match.Groups[1].Value -Encoding utf8
          node --check app-check.js
          Remove-Item app-check.js
      - name: Install dependencies
        working-directory: source
        run: npm install --no-audit --no-fund
      - name: Build installer
        working-directory: source
        run: npm run build
      - name: Verify installer
        working-directory: source
        shell: pwsh
        run: |
          $files = Get-ChildItem "dist/*Setup*.exe"
          if (!$files) { throw "Windows Setup EXE was not produced" }
          $files | ForEach-Object { Write-Host "$($_.Name) - $($_.Length) bytes" }
      - uses: actions/upload-artifact@v4
        with:
          name: ONYX-Windows-Installer
          path: source/dist/*Setup*.exe
          if-no-files-found: error
          retention-days: 30

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Clone source (repository name ends in a dot)
        run: git clone --depth 1 "https://github.com/${{ github.repository }}.git" source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies and prepare Android project
        working-directory: source
        run: |
          npm install --no-audit --no-fund
          npm run prepare:web
          npx cap add android
          npx cap sync android
      - name: Build installable debug APK
        working-directory: source/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Verify APK
        working-directory: source
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ONYX-Android-APK
          path: source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
