name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Clone source (repository name ends in a dot)
        shell: pwsh
        run: git clone --depth 1 "https://github.com/${{ github.repository }}.git" source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate application files and JavaScript syntax
        working-directory: source
        shell: pwsh
        run: |
          if (!(Test-Path "package.json")) { throw "package.json is missing" }
          if (!(Test-Path "main.js")) { throw "main.js is missing" }
          if (!(Test-Path "smart-accountant.html")) { throw "smart-accountant.html is missing" }
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json is valid')"
          node --check main.js
          $html = Get-Content "smart-accountant.html" -Raw
          $match = [regex]::Match($html, '(?s)<script>(.*?)</script>')
          if (!$match.Success) { throw "Application script was not found in smart-accountant.html" }
          Set-Content -Path "app-check.js" -Value $match.Groups[1].Value -Encoding utf8
          node --check app-check.js
          Remove-Item "app-check.js"
          Write-Host "All required entry files and JavaScript syntax checks passed."

      - name: Install dependencies
        working-directory: source
        run: npm install --no-audit --no-fund

      - name: Build Windows installer (disable implicit GitHub publishing)
        working-directory: source
        run: npm run build

      - name: Verify installer exists
        working-directory: source
        shell: pwsh
        run: |
          $files = Get-ChildItem "dist/*Setup*.exe"
          if (!$files) { throw "Windows setup EXE was not produced" }
          $files | ForEach-Object { Write-Host "$($_.Name) - $($_.Length) bytes" }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SmartAccountant-Windows
          path: source/dist/*Setup*.exe
          if-no-files-found: error
          retention-days: 30
