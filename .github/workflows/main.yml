name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Clone source (work around repository name ending in dot)
        shell: pwsh
        run: git clone --depth 1 "https://github.com/${{ github.repository }}.git" source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify application entry files
        working-directory: source
        shell: pwsh
        run: |
          if (!(Test-Path "package.json")) { throw "package.json is missing" }
          if (!(Test-Path "main.js")) { throw "main.js is missing" }
          if (!(Test-Path "smart-accountant.html")) { throw "smart-accountant.html is missing" }

      - name: Install dependencies
        working-directory: source
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        working-directory: source
        run: npm run build

      - name: Verify installer exists
        working-directory: source
        shell: pwsh
        run: |
          $files = Get-ChildItem "dist/*.exe"
          if (!$files) { throw "No Windows installer was produced" }
          Get-ChildItem "dist"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SmartAccountant-Windows
          path: source/dist/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: source/dist/*.exe
